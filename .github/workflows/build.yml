name: Pruebas y ejecutable Windows

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar la versión de facturas_excel/__init__.py como release (crea la etiqueta vX.Y.Z)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Ejecutar pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compilar aplicación
        run: pyinstaller --noconfirm --clean FacturasAplifisa.spec
      - name: Construir instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path facturas_excel/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v installer/FacturasAplifisa.iss
      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist_installer/FacturasAplifisa_Setup_*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FacturasAplifisa-Setup
          path: dist_installer/FacturasAplifisa_Setup_*.exe*
      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path facturas_excel/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publicar release
        # Con una etiqueta vX.Y.Z, o a mano desde Actions marcando «publicar»:
        # entonces se crea la etiqueta con la versión de __init__.py sobre el
        # commit ejecutado (desde la nube no siempre se puede subir la etiqueta
        # con git). El programa instalado se actualiza solo con esta release.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist_installer/FacturasAplifisa_Setup_*.exe*
          generate_release_notes: true
